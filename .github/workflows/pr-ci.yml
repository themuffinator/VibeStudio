name: pr-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate Documentation Version
        run: python scripts/sync_doc_versions.py --check

      - name: Validate Credits And Compiler Pins
        run: python scripts/validate_credits.py

      - name: Validate Changelog
        run: python scripts/changelog.py check

      - name: Install Meson + Ninja
        run: python -m pip install --upgrade pip meson ninja fonttools -r scripts/requirements-docs.txt

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # Qt Multimedia (audio playback) is an add-on module. Windows and macOS
      # install it; the Linux job builds without it, which keeps the
      # no-playback path compiling (see docs/DEPENDENCIES.md).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || matrix.os == 'macos-latest' && 'clang_64' || 'linux_gcc_64' }}
          modules: ${{ matrix.os != 'ubuntu-latest' && 'qtmultimedia' || '' }}

      - name: Validate Translation Extraction
        run: python scripts/extract_translations.py --check --dry-run --require-tool

      - name: Build Windows With Source Evidence
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/build_release.py
          --build-dir builddir
          --evidence artifacts/build-evidence
          --buildtype debugoptimized
          --audio-playback enabled
          --qt-prefix "$env:QT_ROOT_DIR"
          --github-repo "${{ github.repository }}"
          --update-channel dev

      - name: Configure
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          meson setup builddir
          --backend ninja
          --buildtype=debugoptimized
          -Dgithub_repo=${{ github.repository }}
          -Dupdate_channel=dev
          -Daudio_duplex=${{ matrix.os == 'ubuntu-latest' && 'disabled' || 'enabled' }}

      - name: Build
        if: matrix.os != 'windows-latest'
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Validate CLI Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/validate_build.py
          --binary "builddir/src/vibestudio.exe"
          --expected-version "$((Get-Content VERSION -Raw).Trim())"

      - name: Validate CLI Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/validate_build.py
          --binary "builddir/src/vibestudio"
          --expected-version "$(cat VERSION)"

      - name: GUI Self-Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          ./builddir/src/vibestudio.exe
          --self-test
          --settings-file "${{ runner.temp }}/vibestudio-ci.ini"

      - name: GUI Self-Test (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          ./builddir/src/vibestudio
          --self-test
          --settings-file "${{ runner.temp }}/vibestudio-ci.ini"

      - name: Validate CLI Docs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/validate_cli_docs.py
          --binary "builddir/src/vibestudio.exe"

      - name: Validate Credits (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python scripts/validate_credits.py

      - name: Validate CLI Docs (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/validate_cli_docs.py
          --binary "builddir/src/vibestudio"

      - name: Validate Credits (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: python scripts/validate_credits.py

      - name: Validate Sample Projects (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/validate_samples.py
          --binary "builddir/src/vibestudio.exe"

      - name: Validate Sample Projects (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/validate_samples.py
          --binary "builddir/src/vibestudio"

      - name: Validate Portable Package Skeleton (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/validate_packaging.py
          --binary "builddir/src/vibestudio.exe"
          --compiled-translations "builddir/i18n"

      - name: Validate Portable Package Skeleton (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/validate_packaging.py
          --binary "builddir/src/vibestudio"
          --compiled-translations "builddir/i18n"

      - name: Validate Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/validate_release_assets.py
          --binary "builddir/src/vibestudio.exe"

      - name: Validate Release Assets (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/validate_release_assets.py
          --binary "builddir/src/vibestudio"

      - name: Stage Verified Windows Binary And Source
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          python scripts/package_windows_release.py
          --build-dir builddir
          --build-evidence artifacts/build-evidence/build-evidence.json
          --qt-prefix "$env:QT_ROOT_DIR"
          --output artifacts/windows-release

      - name: Stage Portable Artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >
          python scripts/package_portable.py
          --binary "builddir/src/vibestudio"
          --compiled-translations "builddir/i18n"
          --output "artifacts"
          --archive
          --target-platform current

      - name: Upload Portable Artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibestudio-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Verified Windows Binary And Source
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibestudio-windows-latest-${{ github.sha }}
          path: artifacts/windows-release/publish/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Release Diagnostics
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibestudio-windows-diagnostics-${{ github.sha }}
          path: |
            artifacts/build-evidence/*
            artifacts/windows-release/runtime-checks/*.txt
            artifacts/windows-release/runtime-checks/*.json
            artifacts/windows-release/runtime-checks/*.wav
            artifacts/windows-release/INCOMPLETE.txt
          if-no-files-found: warn
          retention-days: 14
